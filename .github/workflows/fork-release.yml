name: Fork release

# Fork-only image for a release branch that is waiting on the official main.
# The official Release workflow refuses any tag that is not the current
# Vanszs/VansRouter main commit and publishes to ghcr.io/vanszs/vansrouter.
# This one never does either: it builds from this repository and pushes to the
# repository owner's own GHCR. Dispatch it by hand.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to build
        required: true
        default: release/0.91.62

permissions:
  contents: read

env:
  GHCR_IMAGE: ghcr.io/zanonaa/vansrouter

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the requested ref
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ inputs.ref }}"
          git checkout --detach FETCH_HEAD
          echo "Building $(git rev-parse HEAD)"
          git status --short

      - name: Read the version this ref ships
        id: version
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.GHCR_IMAGE }}:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            VCS_REF=${{ github.sha }}
          provenance: false
          sbom: false
