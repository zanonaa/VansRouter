name: Gateway CI

on:
  push:
    branches: [main, dev]
    paths:
      - "src/**"
      - "open-sse/**"
      - "scripts/build.js"
      - "scripts/package-closure.cjs"
      - "scripts/fix-standalone-symlinks.cjs"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "Dockerfile"
      - "docker/**"
      - "next.config.mjs"
      - "custom-server.js"
      - ".github/workflows/**"
  pull_request:
    branches: [main, dev]
    paths:
      - "src/**"
      - "open-sse/**"
      - "scripts/build.js"
      - "scripts/package-closure.cjs"
      - "scripts/fix-standalone-symlinks.cjs"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "Dockerfile"
      - "docker/**"
      - "next.config.mjs"
      - "custom-server.js"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build-smoke:
    name: Gateway (Linux / Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Configure pnpm hoisting
        run: |
          echo "public-hoist-pattern=*" >> .npmrc
          echo "shamefully-hoist=true" >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tests
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Build standalone gateway
        run: pnpm run build

      - name: Verify standalone output
        run: |
          test -f .next/standalone/server.js
          test -f .next/standalone/custom-server.js

      - name: Build multi-platform Docker image (no push)
        uses: docker/setup-qemu-action@68827325e0b33c7199eb31dd4e31fbe9023e06e3 # v3.6.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: vansrouter:ci
          build-args: |
            APP_VERSION=ci
            VCS_REF=${{ github.sha }}
          provenance: false
          sbom: false
