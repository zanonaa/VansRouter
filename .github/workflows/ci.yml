name: Gateway CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_IMAGE: ghcr.io/zanonaa/vansrouter

jobs:
  test-and-build:
    name: Tests and Docker (Linux / AMD64 + ARM64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run JavaScript tests
        run: pnpm test

      # Fase 6: build Vite e verificação de que nenhum segredo vaza no bundle.
      - name: Build SPA and scan bundle for secrets
        run: |
          pnpm exec vite build
          node scripts/check-spa-secrets.cjs

      # Fase 6: composição Go+SPA pela mesma origem validada sem navegador
      # (regressão visual completa: scripts/spa-visual-regression.cjs, local).
      - name: Static integration smoke (Go serves SPA)
        run: |
          cd backend && go build -o /tmp/vansrouter-ci ./cmd/api && cd ..
          SPA_DIR="$PWD/dist" PORT=20131 DATA_DIR="$(mktemp -d)" JWT_SECRET=ci-secret \
            /tmp/vansrouter-ci & SERVER=$!
          for i in $(seq 1 20); do curl -sf http://localhost:20131/api/health >/dev/null && break; sleep 1; done
          curl -sf http://localhost:20131/api/health
          curl -sf http://localhost:20131/dashboard | grep -q '<div id="root">'
          ASSET=$(curl -s http://localhost:20131/dashboard | grep -o '/assets/[^"]*\.js' | head -1)
          curl -sf "http://localhost:20131${ASSET}" >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:20131/api/rota-que-nao-existe)" != "200"
          kill $SERVER

      # Dockerfile runs the Vite SPA build; do not build the app a second time here.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR (main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        id: version
        run: node -e 'console.log(`version=${require("./package.json").version}`)' >> "$GITHUB_OUTPUT"

      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.GHCR_IMAGE }}:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            VCS_REF=${{ github.sha }}
          provenance: false
          sbom: false
