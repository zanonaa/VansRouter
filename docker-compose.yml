# VansRouter Docker Compose
# Usage:
#   1. cp .env.example .env && nano .env
#   2. docker compose up -d
#   3. Open http://localhost:20128/masuk

services:
  vansrouter:
    # Full image reference: Dev ARM64 by default; use vansrouter:go-local for a local build.
    image: ${VANSROUTER_IMAGE:-ghcr.io/zanonaa/vansrouter:dev-go-arm64}
    container_name: vansrouter
    restart: unless-stopped
    ports:
      # Local-only by default; expose through an HTTPS reverse proxy if needed.
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-20128}:20128"
    volumes:
      - 9router-data:/app/data
      # Compatibility source for pre-v0.91.22 named-volume installs.
      # Bind-mount users must keep their existing host path or migrate it first.
      # The Go startup migration imports legacy data without discarding the source.
      - vansrouter-data:/migration-data:ro
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:20128/api/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  headroom:
    profiles: [headroom]
    image: ghcr.io/chopratejas/headroom@sha256:50b85d8e320cfcdf1b38919bb7ae067b93ff7a8de0a93f05b2c1246370200d1c
    container_name: headroom
    restart: unless-stopped
    ports:
      - "${HEADROOM_PORT:-8787}:8787"

volumes:
  9router-data:
    name: 9router-data
  vansrouter-data:
    name: vansrouter-data
